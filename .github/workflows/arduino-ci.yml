name: Arduino CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          compliance: specification
          library-manager: submit

  compile:
    name: Compile examples (${{ matrix.board.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - { fqbn: "arduino:avr:uno", platform: "arduino:avr", name: "Arduino Uno" }
          - { fqbn: "esp32:esp32:esp32", platform: "esp32:esp32", name: "ESP32", index-url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json" }
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install platform
        run: |
          if [ -n "${{ matrix.board.index-url }}" ]; then
            arduino-cli core update-index --additional-urls "${{ matrix.board.index-url }}"
            arduino-cli core install ${{ matrix.board.platform }} --additional-urls "${{ matrix.board.index-url }}"
          else
            arduino-cli core update-index
            arduino-cli core install ${{ matrix.board.platform }}
          fi
      - name: Install library from this repo
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$PWD" "$HOME/Arduino/libraries/LiquidCrystal_I2C"
      - name: Compile examples
        run: |
          fail=0
          for example in $(find examples -name "*.ino"); do
            # примеры только для ESP на AVR не собираем
            if [[ "${{ matrix.board.fqbn }}" != esp32* ]] && [[ "$example" == *ESP* ]]; then continue; fi
            echo "::group::$example"
            arduino-cli compile --fqbn ${{ matrix.board.fqbn }} "$example" || fail=1
            echo "::endgroup::"
          done
          exit $fail
